name: Cleanup mistaken publication branches

on:
  push:
    branches:
      - agent/publish-seo-autopilot-v1.4.0

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the two mistaken branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/publish-production-site-autopilot-v7.1.0" \
            || true
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/publish-seo-autopilot-v1.4.0"
